<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f5f6f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 500px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header {
      background: #FF9800;
      color: white;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 500;
    }
    .content {
      padding: 16px;
      line-height: 1.6;
      color: #333;
    }
    .content strong {
      color: #000;
    }
    .button {
      margin: 16px;
      padding: 10px 20px;
      background: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">🚨 知乎热榜 发生变化</div>
    <div class="content">
      <strong>监控对象：</strong> 知乎热榜<br>
      <strong>网址：</strong> https://www.zhihu.com/hot<br><br>
      <strong>AI 摘要：</strong><br>
      排名变化：<br>
      - "马斯克 OpenAI 诉讼案开庭审理" 从第 5 位上升到第 3 位<br>
      - "国产大模型突破 Claude 性能" 新进榜单第 7 位<br><br>
      内容更新：<br>
      - 删除了 "某明星恋情曝光" 话题<br>
      - 新增 "AI 写作工具盯梢上线" 讨论
    </div>
    <button class="button">查看网页</button>
  </div>
</body>
</html>
